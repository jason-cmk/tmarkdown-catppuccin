# Catppuccin Macchiato (dark) and Latte (light) for tmarkdown.
# https://catppuccin.com/palette

[dark]
text          = "#CAD3F5"
muted         = "#8087A2"
faint         = "#494D64"
accent_strong = "#C6A0F6"
accent        = "#8AADF4"
accent_soft   = "#A6DA95"
emphasis      = "#F5A97F"
code_bg       = "#1E2030"
status_bg     = "#181926"
keycap_bg     = "#363A4F"
