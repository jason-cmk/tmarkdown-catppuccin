# Catppuccin Frappe (dark) and Latte (light) for tmarkdown.
# https://catppuccin.com/palette

[dark]
text          = "#C6D0F5"
muted         = "#838BA7"
faint         = "#51576D"
accent_strong = "#CA9EE6"
