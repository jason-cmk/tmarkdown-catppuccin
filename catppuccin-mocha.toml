# Catppuccin Mocha (dark) and Latte (light) for tmarkdown.
# https://catppuccin.com/palette

[dark]
text          = "#CDD6F4"
muted         = "#7F849C"
faint         = "#45475A"
accent_strong = "#CBA6F7"
accent        = "#89B4FA"
accent_soft   = "#A6E3A1"
emphasis      = "#FAB387"
code_bg       = "#181825"
status_bg     = "#11111B"
